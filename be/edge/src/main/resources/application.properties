spring.application.name=edge
edge.version=@project.version@

# The Edge accepts no connection from the network: it listens on loopback only (D-02).
server.address=127.0.0.1
server.port=${EDGE_PORT:8081}

spring.datasource.url=${EDGE_DB_URL}
spring.datasource.username=${EDGE_DB_USER}
spring.datasource.password=${EDGE_DB_PASSWORD}
spring.flyway.enabled=true

# Hub channel. Blank URL = channel not configured. Credential and Hub public key live in the macOS keychain.
edge.hub.url=${EDGE_HUB_URL:}
edge.hub.allow-insecure=${EDGE_HUB_ALLOW_INSECURE:false}
edge.hub.ca-file=${EDGE_HUB_CA_FILE:}
edge.hub.reconnect-initial=1s
edge.hub.reconnect-max=60s
edge.hub.connect-timeout=10s
edge.heartbeat-interval=30s

edge.ai.ollama-url=${EDGE_OLLAMA_URL:http://127.0.0.1:11434}
# Hardware profile "test-24GB" (capitolato C.8). One large model at a time (heavy lane), small ones in parallel.
# ANALYSIS, DRAFTING and IMAGES stay unassigned until the benchmark chooses the model (the admin assigns it).
edge.ai.profile=test-24GB
edge.ai.light-concurrency=2
edge.ai.heavy-concurrency=1
edge.ai.request-timeout=300s
edge.ai.default-models.CLASSIFICATION=qwen3:8b
edge.ai.default-models.EXTRACTION=qwen3:8b
edge.ai.default-models.EMBEDDING=bge-m3

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true

# Job engine and scheduler (capitolato sez. 40, 7.10, B.18). Times are local in zone Europe/Rome, every day.
edge.jobs.workers=2
edge.jobs.poll-interval=2s
edge.jobs.lease=2m
edge.jobs.retention=90d
# The protocol schedule stays OFF until the PROTOCOL_RUN handler exists (Release 2); without a handler it would only log.
edge.jobs.schedules.protocol-run.enabled=false
edge.jobs.schedules.protocol-run.type=PROTOCOL_RUN
edge.jobs.schedules.protocol-run.zone=Europe/Rome
edge.jobs.schedules.protocol-run.times=14:30,18:30

# NAS (capitolato sez. 5). The SMB shares are mounted by macOS (credentials in the macOS keychain, never here).
# The UNC path is documentation only. A share missing from every mode below cannot be reached at all:
# "temporanea" is excluded on purpose (5.3). The PROTOCOL_WRITE root is a proposal to confirm against the real
# structure of the Archivio.
edge.nas.shares.archivio.unc=\\\\192.168.1.57\\Archivio
edge.nas.shares.archivio.mount=${EDGE_NAS_MOUNT_ARCHIVIO:/Volumes/Archivio}
edge.nas.shares.gare.unc=\\\\192.168.1.57\\Gare
edge.nas.shares.gare.mount=${EDGE_NAS_MOUNT_GARE:/Volumes/Gare}
edge.nas.shares.documenti.unc=\\\\192.168.1.57\\Documenti
edge.nas.shares.documenti.mount=${EDGE_NAS_MOUNT_DOCUMENTI:/Volumes/Documenti}
edge.nas.shares.temporanea.unc=\\\\192.168.1.57\\Temporanea
edge.nas.shares.temporanea.mount=${EDGE_NAS_MOUNT_TEMPORANEA:/Volumes/Temporanea}
edge.nas.modes.index-read[0]=archivio:/
edge.nas.modes.index-read[1]=documenti:/
edge.nas.modes.index-read[2]=gare:/
edge.nas.modes.protocol-write[0]=archivio:/Protocolli
edge.nas.modes.tender-write[0]=gare:/
edge.nas.min-free-bytes=5368709120
edge.nas.availability-timeout=3s
edge.nas.allow-unmounted-directory=false

# FreeLLMAPI (Allegato A): external free provider on loopback. The unified key is in the keychain (freellmapi-key).
# imageProfile stays empty until the IMMAGINI group exists; the photo functions are then BLOCCATA_DA_DIPENDENZA.
edge.ai.freellmapi.url=${EDGE_FREELLMAPI_URL:http://127.0.0.1:3001}
edge.ai.freellmapi.text-profile=${EDGE_FREELLMAPI_TEXT_PROFILE:auto}
edge.ai.freellmapi.image-profile=${EDGE_FREELLMAPI_IMAGE_PROFILE:}
edge.ai.freellmapi.daily-limit-per-user=30
edge.ai.freellmapi.request-timeout=60s

# Document index (capitolato 5.3). index-roots empty = every INDEX_READ root. max-files-per-run 0 = no limit.
edge.docs.max-file-bytes=104857600
edge.docs.max-pages=3000
edge.docs.max-chars=2000000
edge.docs.extract-timeout=60s
edge.docs.chunk-size=800
edge.docs.chunk-overlap=100
edge.docs.embed-batch=16
# Cosine similarity below which a passage matching only by meaning is dropped. 0 = off until calibrated on real data.
edge.docs.min-similarity=0
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR
