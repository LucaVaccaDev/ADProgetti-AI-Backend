spring.application.name=edge
edge.version=@project.version@

# The Edge accepts no connection from the network: it listens on loopback only (D-02).
server.address=127.0.0.1
server.port=${EDGE_PORT:8081}

spring.datasource.url=${EDGE_DB_URL}
spring.datasource.username=${EDGE_DB_USER}
spring.datasource.password=${EDGE_DB_PASSWORD}
spring.flyway.enabled=true

# Hub channel. Blank URL = channel not configured. Credential and Hub public key live in the macOS keychain.
edge.hub.url=${EDGE_HUB_URL:}
edge.hub.allow-insecure=${EDGE_HUB_ALLOW_INSECURE:false}
edge.hub.ca-file=${EDGE_HUB_CA_FILE:}
edge.hub.reconnect-initial=1s
edge.hub.reconnect-max=60s
edge.hub.connect-timeout=10s
edge.heartbeat-interval=30s

edge.ai.ollama-url=${EDGE_OLLAMA_URL:http://127.0.0.1:11434}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true
