# Read-only trial of the NAS service on the external SSD (/Volumes/AI), before the real NAS is connected.
# Start the Edge with SPRING_PROFILES_ACTIVE=ssdtest. Lists replace (not merge with) the defaults, so the real
# NAS shares are not reachable in any mode and `ollama` on the SSD is outside every allowed root.
edge.nas.shares.gare.unc=ssd-test
edge.nas.shares.gare.mount=/Volumes/AI
edge.nas.modes.index-read[0]=gare:/GARE 2024
edge.nas.modes.index-read[1]=gare:/GARE 2025
edge.nas.modes.index-read[2]=gare:/REFERENZE
edge.nas.modes.protocol-write=
edge.nas.modes.tender-write=

# First indexing trial: only GARE 2025, 200 new files per run (click again to continue; unchanged files are skipped).
edge.docs.index-roots[0]=gare:/GARE 2025
edge.docs.max-files-per-run=200

# The studio's references Excel (copy of docs/materiali on the SSD); read through the NAS service like any file.
edge.references.file=gare:/REFERENZE/certificazioni_ultimi_10_anni_2026.xlsx
edge.references.sheet=10 ANNI

# Tender documents the user drops for reading: on the test SSD so they can be dropped from any Mac session. They are
# read once and deleted. This folder is outside every NAS root (the NAS service never sees it); in production the inbox
# stays on the Edge's own disk (default ~/zio-inbox/gare).
edge.tenders.docs.inbox=/Volumes/AI/BANDI PROVVISORI
