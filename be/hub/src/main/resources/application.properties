spring.application.name=hub

spring.datasource.url=${HUB_DB_URL}
spring.datasource.username=${HUB_DB_USER}
spring.datasource.password=${HUB_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Secrets come from environment variables only (CLAUDE.md section 9).
hub.security.jwt-secret=${HUB_JWT_SECRET:}
hub.security.issuer=zio-hub
hub.security.access-token-ttl=15m
hub.security.refresh-token-ttl=7d
hub.security.cookie-secure=${HUB_COOKIE_SECURE:true}
hub.security.max-failed-attempts=5
hub.security.lockout=15m

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.persistent=false
spring.mvc.problemdetails.enabled=true
